name: Validate PR

on:
  pull_request:
    branches: ["**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.23.6

      - name: Typecheck scripts
        run: pnpm typecheck

      - name: Validate episodes
        run: pnpm validate:episodes

      - name: Build site
        run: |
          zola build
          cp public/feed.xml public/feed.rss

      - name: Validate RSS feed
        run: pnpm validate:feed
