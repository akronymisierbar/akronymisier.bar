name: Validate PR

on:
  pull_request:
    branches: ["**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.19.2

      - name: Validate episodes
        run: deno run --allow-read --allow-net scripts/validate-episode.ts

      - name: Build site
        run: |
          zola build
          cp public/feed.xml public/feed.rss

      - name: Validate RSS feed (W3C)
        run: |
          deno run --allow-net scripts/validate-feed-w3c.ts \
            "https://validator.w3.org/feed/check.cgi?url=https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/public/feed.rss"
        continue-on-error: true

  comment-on-episode-change:
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.changed_files, 'episodes/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Post Podbase validator link
        uses: actions/github-script@v7
        with:
          script: |
            const podbaseURL = `https://podba.se/?url=https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/${context.sha}/public/feed.rss`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `This PR changes episode files. Please also check [podbase's feed validator](${podbaseURL}) after the build completes.`
            });
