name: Check Links

# Runs on every PR because check-links-pr is a required check; a paths filter
# would leave it pending forever on PRs that touch no episode.
on:
  pull_request:
    branches: ["**"]

jobs:
  check-links-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check links in changed episodes
        run: pnpm check-links --changed-only
