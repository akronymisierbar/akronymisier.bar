name: Check Links

on:
  pull_request:
    branches: ["**"]
    paths:
      - "content/episodes/*.md"

  schedule:
    # Run every three months
    - cron: "0 4 1 */3 *"

  workflow_dispatch:
    inputs:
      all_episodes:
        description: "Check all episodes"
        required: false
        default: false
        type: boolean

jobs:
  check-links-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check links in changed episodes
        run: pnpm check-links --changed-only

  check-links-scheduled:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.all_episodes)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check all episode links
        run: pnpm check-links
