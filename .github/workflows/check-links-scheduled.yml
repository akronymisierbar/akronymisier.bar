name: Check Links (scheduled)

# Separate from check-links.yml: GitHub disables workflows with a schedule
# after 60 days without repository activity, which would also stop the
# required PR check.
on:
  schedule:
    # Run every three months
    - cron: "0 4 1 */3 *"
  workflow_dispatch:

jobs:
  check-links-all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check all episode links
        run: pnpm check-links
